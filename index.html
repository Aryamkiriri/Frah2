<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArrayStack | Pro Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#070a12;--pn:#0f1424;--tx:#eaf0ff;--mu:#8b95b3;--ln:#ffffff18;--ac:#3de0ff;--gl:#ffffff0a;--mono:"JetBrains Mono",Consolas,"Courier New",monospace}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f4fb;--pn:#fff;--tx:#0d1224;--mu:#5b6482;--ln:#0d122426;--gl:#0d12240a}}
:root[data-theme="light"]{--bg:#f1f4fb;--pn:#fff;--tx:#0d1224;--mu:#5b6482;--ln:#0d122426;--gl:#0d12240a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.7;overflow:hidden;transition:.6s}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--ac) 28%,transparent),transparent 70%),linear-gradient(var(--gl) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,var(--gl) 1px,transparent 1px) 0 0/44px 44px;pointer-events:none;transition:.8s}
#deck{position:fixed;inset:0 0 calc(74px + env(safe-area-inset-bottom,0px)) 0}
.slide{position:absolute;inset:0;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 14px;overflow-y:auto;opacity:0;pointer-events:none;transform:scale(.96);filter:blur(10px);transition:.65s cubic-bezier(.2,.8,.2,1)}
.slide.on{opacity:1;pointer-events:auto;transform:none;filter:none}
.in{max-width:1040px;margin:auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;position:relative}
.mono{font-family:var(--mono);direction:ltr}
.kick{font:700 13px var(--mono);letter-spacing:3px;color:var(--ac);direction:ltr;text-transform:uppercase}
h1{font:900 clamp(54px,15vw,150px)/.95 "Cairo",sans-serif;margin:6px 0;letter-spacing:-2px;background:linear-gradient(120deg,var(--tx) 30%,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr;text-align:center}
h2{font:900 clamp(26px,5vw,44px)/1.2 "Cairo",sans-serif;margin:0}
.mu{color:var(--mu)}
.cover{align-items:center;text-align:center}
.tower{display:flex;flex-direction:column-reverse;gap:5px;margin:16px 0;width:min(300px,80%)}
.blk{padding:6px 14px;border-radius:8px;font-weight:700;color:#07101a;background:var(--c);display:flex;justify-content:space-between;animation:fall .7s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--d)*.45s + .2s);box-shadow:0 6px 24px color-mix(in srgb,var(--c) 40%,transparent)}
.blk small{font:700 12px var(--mono);opacity:.7}
@keyframes fall{from{transform:translateY(-260px);opacity:0}}
.cur::after{content:"▌";animation:bl 1s steps(1) infinite;color:var(--ac)}@keyframes bl{50%{opacity:0}}
.hd{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.num{font:900 clamp(70px,14vw,130px)/1 var(--mono);color:transparent;-webkit-text-stroke:2px var(--ac);direction:ltr;opacity:.9}
.role{color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.win{background:#0b0f1d;border:1px solid #ffffff20;border-radius:14px;overflow:hidden;box-shadow:0 30px 70px #0008,0 0 0 1px color-mix(in srgb,var(--ac) 25%,transparent);direction:ltr}
.tb{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#141a2e;font:12px var(--mono);color:#8b95b3}
.tb i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.tb i:nth-child(2){background:#febc2e}.tb i:nth-child(3){background:#28c840}
pre{margin:0;padding:14px 8px;overflow-x:auto;color:#dfe6ff;font:clamp(12px,2.5vw,14.5px)/1.8 var(--mono);text-align:left;direction:ltr}
.ln{display:block;padding:0 10px 0 0;border-radius:4px;transition:.25s}
.ln::before{content:attr(data-n);display:inline-block;width:30px;margin-right:12px;text-align:right;color:#4b5578}
.ln.on{background:#ffd54f2a;box-shadow:inset 3px 0 0 #ffd54f}
.k{color:#c792ea}.s{color:#a8e98a}.n{color:#ffa86b}.c{color:#6b7599}
.slide.on .cd .ln{animation:rv .5s both;animation-delay:calc(var(--i)*.12s + .35s)}
@keyframes rv{from{opacity:0;transform:translateX(-16px)}}
.notes{list-style:none;margin:0;padding:0;counter-reset:n}
.notes li{counter-increment:n;position:relative;background:var(--gl);border:1px solid var(--ln);backdrop-filter:blur(8px);border-radius:14px;padding:12px 14px 12px 50px;padding-inline:54px 14px;margin-bottom:10px;font-size:15px;animation:rv .6s both;animation-delay:calc(var(--i)*.15s + .6s)}
.notes li::before{content:counter(n);position:absolute;inset-inline-start:12px;top:10px;width:30px;height:30px;border-radius:9px;background:var(--ac);color:#07101a;font:900 15px var(--mono);display:grid;place-items:center}
.btn{border:1px solid var(--ln);border-radius:10px;padding:8px 16px;font:700 14px "Cairo",sans-serif;cursor:pointer;background:var(--gl);color:var(--tx);transition:.2s;backdrop-filter:blur(8px)}
.btn:hover{border-color:var(--ac);transform:translateY(-2px)}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.m{background:var(--ac);color:#07101a;border-color:var(--ac)}
.demo{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:12px}
@media(max-width:820px){.demo{grid-template-columns:1fr}}
.tw{display:flex;flex-direction:column-reverse;gap:6px;direction:ltr;background:var(--gl);border:1px solid var(--ln);border-radius:16px;padding:12px;position:relative;min-height:340px;justify-content:flex-start}
.tw::after{content:"CAPACITY = 5";position:absolute;top:-10px;left:14px;font:700 11px var(--mono);background:var(--bg);padding:0 8px;color:var(--mu)}
.slot{height:56px;border:2px dashed var(--ln);border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font:700 12px var(--mono);color:var(--mu);transition:.3s}
.slot b{font-size:24px;color:#07101a}
.slot.f{border:2px solid transparent;background:linear-gradient(120deg,var(--ac),#f5c451);animation:in .5s cubic-bezier(.3,1.4,.5,1)}
.slot.f span{color:#07101a99}
.slot.top{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ac)}
.slot.err{animation:sh .5s;border-color:#ff5c6c;color:#ff5c6c}
.slot.hl{outline:3px solid #ffd54f}
.slot em{font:700 12px var(--mono);font-style:normal;color:#07101a;min-width:34px;text-align:right}
@keyframes in{from{transform:translateY(-120px) scale(.8);opacity:0}}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.stats{display:flex;gap:8px;margin-bottom:10px}
.st{flex:1;background:var(--gl);border:1px solid var(--ln);border-radius:12px;padding:6px;text-align:center}
.st b{display:block;font:700 20px var(--mono);color:var(--ac)}.st span{font-size:12px;color:var(--mu)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input{width:80px;border:1px solid var(--ln);background:var(--gl);color:var(--tx);border-radius:10px;padding:7px;font:700 15px var(--mono);text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
#log{background:#05070d;color:#7dffb0;border-radius:12px;padding:10px;height:92px;overflow:auto;font:12.5px/1.6 var(--mono);margin-top:10px;direction:ltr;text-align:left;border:1px solid #ffffff14}
#log .e{color:#ff7b88}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.chip{border:1px solid var(--ln);background:var(--gl);border-radius:14px;padding:10px 18px}
.chip b{display:block;font:700 22px var(--mono);color:var(--ac)}
.out{background:#05070d;color:#7dffb0;border:1px solid #ffffff14;border-radius:14px;padding:14px 20px;font:15px/1.8 var(--mono);text-align:left;direction:ltr;display:inline-block}
#bar{position:fixed;inset:auto 0 0 0;height:calc(74px + env(safe-area-inset-bottom,0px));padding:6px 14px env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9}
#bar::before{content:"";position:absolute;top:-1px;right:0;height:2px;width:calc(var(--p,0)*100%);background:linear-gradient(270deg,var(--ac),#f5c451);transition:.6s}
.nav{display:flex;align-items:center;gap:14px}
.nb{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--gl);color:var(--tx);font-size:18px;cursor:pointer}
.nb:hover{border-color:var(--ac)}
#dots{display:flex;gap:6px}#dots i{width:8px;height:8px;border-radius:4px;background:var(--ln);cursor:pointer;transition:.3s}#dots i.a{width:26px;background:var(--ac)}
.sig{font:700 13px var(--mono);letter-spacing:2px;color:var(--mu);direction:ltr}
.sig b{color:var(--ac)}
</style>
</head>
<body>
<div id="deck"></div>
<div id="bar"><div class="nav"><button class="nb" id="pv" aria-label="السابق">›</button><div id="dots"></div><button class="nb" id="nx" aria-label="التالي">‹</button></div><div class="sig">// signed by <b>asraj2026</b></div></div>

<script>
const $=id=>document.getElementById(id);
const hi=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(\/\/.*|"[^"]*"|\b(?:public|class|static|final|int|void|boolean|return|if|new|for|throw|this|null)\b|\b\d+\b)/g,m=>`<span class="${m[0]=='/'?'c':m[0]=='"'?'s':/\d/.test(m[0])?'n':'k'}">${m}</span>`);
const L=(a,x)=>a.map((l,i)=>`<span class="ln" data-n="${i+1}" ${x?`style="--i:${i}"`:''}>${hi(l)||' '}</span>`).join('');
const mark=(id,i)=>document.querySelectorAll('#'+id+' .ln').forEach((e,j)=>e.classList.toggle('on',j===i));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ACC=["#3de0ff","#3de0ff","#f5c451","#ff7a6b","#5df2b0","#a78bfa","#3de0ff","#f5c451"];
const S=[
["فرح","الكلاس · المتغيرات · المشيّدان",`public class ArrayStack<E> {
    public static final int CAPACITY = 5;
    E[] data;
    int t = -1;

    public ArrayStack() {
        this(CAPACITY);
    }

    public ArrayStack(int capacity) {
        data = (E[]) new Object[capacity];
    }`,["‏<E> يخلّي الستاك يقبل أي نوع بيانات","data هي المصفوفة اللي تخزّن العناصر وسعتها 5","t = -1 تعني الستاك فاضي، وt مؤشر لآخر عنصر","المشيّد الافتراضي يستدعي الثاني بالسعة الجاهزة"]],
["عبير","دالتا الحجم والفحص",`    public int size() {
        return t + 1;
    }

    public boolean isEmpty() {
        return t == -1;
    }`,["size: t فهرس يبدأ من 0 فنضيف 1","isEmpty: لو t تساوي -1 فما في عناصر","الدالتان فوريتان: O(1)"]],
["أسرار","دالة الإضافة push",`    public void push(E e) {
        if (size() == data.length)
            throw new IllegalStateException("Stack is full");
        data[++t] = e;
    }`,["نفحص أول: هل الستاك ممتلئ؟","لو ممتلئ نرمي استثناء Stack is full","++t يرفع المؤشر ثم نخزّن العنصر في القمة"]],
["رغد","دالتا الحذف pop والعرض display",`    public E pop() {
        if (isEmpty()) return null;
        E ans = data[t];
        data[t] = null;
        t--;
        return ans;
    }

    public void display() {
        for (int i = 0; i <= t; i++)
            System.out.print(data[i] + " ");
    }`,["pop: لو فاضي نرجّع null","نحفظ العنصر العلوي ثم نفرّغ خانته وننزّل t","display: حلقة من 0 إلى t تطبع كل العناصر"]],
["أريام","دالة الـ main كاملة",`    public static void main(String[] args) {
        ArrayStack<Integer> s = new ArrayStack<Integer>();
        s.push(40);
        s.push(60);
        s.push(50);
        s.push(70);
        s.push(80);
        s.display();
        //s.push(20); This will throw an exception that stack is full
        System.out.println("\\nPopped up element is " + s.pop());
        s.display();
    }
}`,["ننشئ ستاك أعداد صحيحة ونعبّيه بخمس قيم","العنصر السادس (20) يرمي استثناء لأن الستاك ممتلئ","pop يطلّع آخر داخل وهو 80"]]];
const F={push:["public void push(E e) {","    if (size() == data.length)","        throw new IllegalStateException(\"Stack is full\");","    data[++t] = e;","}"],pop:["public E pop() {","    if (isEmpty()) return null;","    E ans = data[t];","    data[t] = null;","    t--;","    return ans;","}"],display:["public void display() {","    for (int i = 0; i <= t; i++)","        System.out.print(data[i] + \" \");","}"]};
const M=["Stack<Integer> s = new ArrayStack<>();","s.push(40);","s.push(60);","s.push(50);","s.push(70);","s.push(80);","s.display();","//s.push(20); // exception","println(\"Popped: \" + s.pop());","s.display();"];
const W=["فرح","عبير","أسرار","رغد","أريام"],WC=["#3de0ff","#5df2b0","#f5c451","#ff7a6b","#a78bfa"];
const sl=[];
sl.push(`<div class="in cover"><div class="kick">Data Structures · COMP 321</div><h1>STACK</h1><div class="mu" style="font-size:20px;font-weight:700">الستاك بالمصفوفة · آخر داخل أول خارج</div>
<div class="tower">${W.map((n,i)=>`<div class="blk" style="--c:${WC[i]};--d:${i}"><span>${n}</span><small>push(${i+1})</small></div>`).join('')}</div>
<div class="mono mu cur">new ArrayStack&lt;Team&gt;(5);</div></div>`);
S.forEach((s,i)=>sl.push(`<div class="in"><div class="hd"><div class="num">0${i+1}</div><div><div class="role">${s[1]}</div><h2>${s[0]}</h2></div></div>
<div class="grid"><div class="win"><div class="tb"><i></i><i></i><i></i><span style="margin-inline-start:8px">ArrayStack.java</span></div><pre class="cd">${L(s[2].split('\n'),1)}</pre></div>
<ol class="notes">${s[3].map((n,j)=>`<li style="--i:${j}">${n}</li>`).join('')}</ol></div></div>`));
sl.push(`<div class="in"><div class="kick">Live Execution</div><h2>شغّل الكود بنفسك</h2>
<div class="demo"><div class="tw" id="tw"></div><div>
<div class="stats"><div class="st"><b id="vS">0</b><span>size()</span></div><div class="st"><b id="vE">true</b><span>isEmpty()</span></div><div class="st"><b id="vT">-1</b><span>t</span></div></div>
<div class="ctl"><input id="inp" type="number" value="40" aria-label="القيمة"><button class="btn m" id="bPush">push</button><button class="btn" id="bPop">pop</button><button class="btn" id="bDisp">display</button><button class="btn" id="bReset">reset</button><button class="btn m" id="bMain">▶ run main</button></div>
<div class="two"><div class="win"><div class="tb"><i></i><i></i><i></i><span id="fnT">method</span></div><pre id="fnCode" style="min-height:130px"></pre></div><div class="win"><div class="tb"><i></i><i></i><i></i><span>main()</span></div><pre id="mainCode"></pre></div></div>
<div id="log"></div></div></div></div>`);
sl.push(`<div class="in cover"><div class="kick">The End</div><h1 style="font-size:clamp(44px,11vw,110px)">THANK YOU</h1><div style="font:900 24px Cairo">شكراً لحسن استماعكم</div>
<div class="chips"><div class="chip"><b>O(1)</b>push</div><div class="chip"><b>O(1)</b>pop</div><div class="chip"><b>O(1)</b>size · isEmpty</div><div class="chip"><b>O(n)</b>display</div></div>
<div class="out">40 60 50 70 80<br>Popped up element is 80<br>40 60 50 70</div>
<p class="mu" style="margin-top:16px">${W.join(' · ')}</p></div>`);
$('deck').innerHTML=sl.map(h=>`<section class="slide">${h}</section>`).join('');
$('dots').innerHTML=sl.map((_,i)=>`<i data-i="${i}"></i>`).join('');
$('mainCode').innerHTML=L(M);
let cur=0;
function go(n){cur=Math.max(0,Math.min(sl.length-1,n));
 document.querySelectorAll('.slide').forEach((e,i)=>e.classList.toggle('on',i===cur));
 document.querySelectorAll('#dots i').forEach((e,i)=>e.classList.toggle('a',i===cur));
 document.body.style.setProperty('--ac',ACC[cur]);$('bar').style.setProperty('--p',(cur+1)/sl.length);
 $('pv').style.visibility=cur?'visible':'hidden';$('nx').style.visibility=cur<sl.length-1?'visible':'hidden'}
$('nx').onclick=()=>go(cur+1);$('pv').onclick=()=>go(cur-1);
$('dots').onclick=e=>{if(e.target.dataset.i)go(+e.target.dataset.i)};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'||e.key===' ')go(cur+1);if(e.key==='ArrowRight')go(cur-1)});
let sx=0,sy=0;const dk=$('deck');
dk.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
dk.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5&&!e.target.closest('pre,#log'))go(dx>0?cur+1:cur-1)});

let data,t,busy=false;
const log=(m,e)=>{const d=document.createElement('div');if(e)d.className='e';d.textContent='$ '+m;$('log').append(d);$('log').scrollTop=1e5};
function render(err){
 $('tw').innerHTML=data.map((v,i)=>`<div class="slot ${v!=null?'f':''} ${i===t?'top':''} ${err&&i===4?'err':''}"><span>data[${i}]</span><b>${v??''}</b><em>${i===t?'◀ t':''}</em></div>`).join('');
 $('vS').textContent=t+1;$('vE').textContent=t===-1;$('vT').textContent=t}
function reset(){data=Array(5).fill(null);t=-1;render();$('log').innerHTML='';log('new ArrayStack<Integer>()  // CAPACITY = 5');$('fnCode').innerHTML=L(['// press any button']);$('fnT').textContent='method';mark('mainCode',-1)}
async function run(fn,steps,act){$('fnT').textContent=fn+'()';$('fnCode').innerHTML=L(F[fn]);for(const i of steps){mark('fnCode',i);await sleep(480)}const r=act();mark('fnCode',-1);return r}
async function push(v){
 if(t+1===5){await run('push',[0,1,2],()=>{});render(true);log('IllegalStateException: Stack is full',1);return}
 await run('push',[0,1,3],()=>{data[++t]=v});render();log(`push(${v}) -> t = ${t}`)}
async function pop(){
 if(t===-1){await run('pop',[0,1],()=>{});log('pop() -> null (empty)',1);return}
 let a;await run('pop',[0,1,2,3,4,5],()=>{a=data[t];data[t]=null;t--});render();log(`pop() -> ${a} , t = ${t}`)}
async function disp(){
 $('fnT').textContent='display()';$('fnCode').innerHTML=L(F.display);let o='';mark('fnCode',0);await sleep(350);
 for(let i=0;i<=t;i++){mark('fnCode',1);await sleep(220);mark('fnCode',2);o+=data[i]+' ';document.querySelectorAll('#tw .slot')[i].classList.add('hl');await sleep(330)}
 mark('fnCode',-1);render();log('display() -> '+(o||'(empty)'))}
const lock=f=>async()=>{if(busy)return;busy=true;document.querySelectorAll('#deck .btn').forEach(b=>b.disabled=true);try{await f()}finally{busy=false;document.querySelectorAll('#deck .btn').forEach(b=>b.disabled=false)}};
$('bPush').onclick=lock(()=>push(+$('inp').value||0));$('bPop').onclick=lock(pop);$('bDisp').onclick=lock(disp);$('bReset').onclick=lock(async()=>reset());
$('bMain').onclick=lock(async()=>{reset();
 for(const [i,v] of [[1,40],[2,60],[3,50],[4,70],[5,80]]){mark('mainCode',i);await push(v)}
 mark('mainCode',6);await disp();mark('mainCode',7);await push(20);mark('mainCode',8);await pop();mark('mainCode',9);await disp();mark('mainCode',-1);log('process finished with exit code 0')});
reset();go(0);
</script>
</body>
</html>
